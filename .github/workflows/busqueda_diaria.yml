name: Búsqueda diaria de alquileres

on:
  schedule:
    - cron: '0 12,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear config.json desde secrets
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: |
          python3 -c "
import json, os
config = {
    'telegram_token':    os.environ['TELEGRAM_TOKEN'],
    'telegram_chat_ids': json.loads(os.environ['TELEGRAM_CHAT_IDS'])
}
json.dump(config, open('config.json', 'w'))
"

      - name: Ejecutar búsqueda
        run: python rental_alert.py

      - name: Guardar seen_listings.json en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json
          git diff --cached --quiet || git commit -m "chore: actualizar seen_listings [skip ci]"
          git push
